name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-sizes:
    name: File size limit (10 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject tracked files larger than 10 MB
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          limit = 10_000_000
          tree = subprocess.check_output(["git", "ls-tree", "-r", "-l", "-z", "HEAD"])
          failures = []
          for entry in tree.split(b"\0"):
              if not entry:
                  continue
              metadata, path = entry.split(b"\t", 1)
              _, kind, _, size = metadata.split()
              if kind == b"blob" and int(size) > limit:
                  failures.append((path.decode("utf-8", errors="replace"), int(size)))
          for path, size in failures:
              print(f"File exceeds 10 MB: {path!r} ({size:,} bytes)")
          if failures:
              print("Compress these files or move them to Release attachments.")
          sys.exit(bool(failures))
          PY

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # Actions are pinned to a commit; the comment names its release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The Wuji Hand 2 model is the wuji-description submodule.
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest
